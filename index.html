<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOUNSEO LEE — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #F4F4F5;
      color: #111111;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 상단 미니멀 갤러리 헤더 */
    header {
      height: 46px;
      flex-shrink: 0;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #E5E5E7;
      background: #FFFFFF;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555555;
    }
    .brand {
      font-weight: 500;
      color: #111111;
    }
    .subtitle {
      font-weight: 300;
      color: #888888;
    }

    /* 중앙 캔버스(슬라이드) 영역 — 여백 확보 */
    #viewer-container {
      flex: 1;
      min-height: 0;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 88px;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background: #FFFFFF;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.04);
      border-radius: 2px;
      transition: opacity 0.2s ease;
    }
    #loader {
      position: absolute;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #888888;
      text-transform: uppercase;
    }

    /* 좌우 화이트 원형 화살표 버튼 */
    .side-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1px solid #E2E2E5;
      color: #333333;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
      z-index: 10;
    }
    .side-arrow svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.6;
      fill: none;
    }
    .side-arrow:hover:not(:disabled) {
      background: #FFFFFF;
      border-color: #B8B8BE;
      color: #000000;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.11);
      transform: translateY(-50%) scale(1.04);
    }
    .side-arrow:disabled {
      opacity: 0.3;
      cursor: default;
      box-shadow: none;
    }
    #side-prev { left: 24px; }
    #side-next { right: 24px; }

    /* 하단 컨트롤 바 */
    footer {
      height: 48px;
      flex-shrink: 0;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #E5E5E7;
      background: #FFFFFF;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .text-btn {
      background: #FFFFFF;
      color: #333333;
      border: 1px solid #E0E0E4;
      padding: 5px 12px;
      font-size: 11px;
      font-family: inherit;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s ease;
    }
    .text-btn:hover:not(:disabled) {
      border-color: #999999;
      color: #000000;
      background: #FAFAFA;
    }
    .text-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .page-indicator {
      min-width: 58px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: #444444;
    }
    .download-link {
      color: #666666;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.06em;
      border-bottom: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .download-link:hover {
      color: #111111;
      border-bottom-color: #111111;
    }

    @media (max-width: 768px) {
      header, footer { padding: 0 16px; }
      .subtitle { display: none; }
      #viewer-container { padding: 16px 48px; }
      .side-arrow { width: 34px; height: 34px; }
      #side-prev { left: 8px; }
      #side-next { right: 8px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header>
    <span class="brand">YOUNSEO LEE</span>
    <span class="subtitle">Self-Driven Boundary-Crossing Learner</span>
  </header>

  <main id="viewer-container">
    <button id="side-prev" class="side-arrow" aria-label="Previous slide">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <div id="loader">Loading Portfolio...</div>
    <canvas id="pdf-render"></canvas>

    <button id="side-next" class="side-arrow" aria-label="Next slide">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </main>

  <footer>
    <div class="nav-group">
      <button id="prev" class="text-btn">PREV</button>
      <span class="page-indicator"><span id="page-num">01</span> / <span id="page-count">--</span></span>
      <button id="next" class="text-btn">NEXT</button>
    </div>
    <a id="download-btn" class="download-link" download>DOWNLOAD PDF ↗</a>
